name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check repository rules
        run: python scripts/repo_rules.py check --config repo-rules.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Extension Host integration tests
        run: npm run test:integration

      - name: Extension Host integration tests (minimum supported VS Code)
        # The bundle was built by the previous step; run it on the engines.vscode version.
        run: node test/integration/runTest.js
        env:
          VSCODE_TEST_VERSION: minimum

      - name: Package VSIX
        # vsce verifies types and produces the same production bundle tested above.
        run: npx --no-install vsce package
