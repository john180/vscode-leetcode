name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Global PAT publishing is supported until 2026-12-01; after that use Entra ID
  # with `vsce publish --azure-credential`.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        run: |
          node -e "const p=require('./package.json'); if (p.version !== '${{ inputs.version }}') { console.error('package.json version is ' + p.version); process.exit(1); }"

      - name: Build and package
        run: npm run package

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$(ls vscode-leetcode-*.vsix | head -n 1)"
